[project]
name = "accountable"
version = "0.1.0"
description = "A local sales CRM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
src = ["backend", "backend/tests"]
include = ["backend/**/*.py"]

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.report]
fail_under = 80

[tool.ty.src]
include = ["backend"]

[tool.coverage.run]
source = ["accountable"]
