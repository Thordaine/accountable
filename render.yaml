services:
  - type: web
    name: accountable
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && uv sync --frozen --no-dev && npm -w frontend run build
    startCommand: uv run --no-dev uvicorn accountable.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: NODE_VERSION
        value: 24.22.3
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
